[package]
name = "navigator"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dependencies]
clap = "4.5.56"
log = "0.4"
crossterm = "0.29.0"
image = "0.25.9"
ratatui = "0.30.0"
resvg = "0.46.0"
ratatui-image = { version = "10.0.4", default-features = false, features = [
	"image-defaults",
	"crossterm",
] }
